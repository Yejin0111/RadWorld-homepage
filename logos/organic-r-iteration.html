</style></head><body><main class="page"><header><p class="eyebrow">RadWorld / Organic R</p><button class="theme" aria-pressed="false">浅色预览</button></header><h1>A world within R.</h1><p class="intro">保留柔和的三维曲面，让竖干、上方字腔和右下方的曲面共同形成 R。用同一个体积表达 RadWorld 的首字母与内部空间。</p><section class="stage" aria-label="新方向预览"><img class="hero" src="concepts/08-organic-r.png" alt="灰蓝色的有机三维 R 标志，曲面包围上方字腔并延伸为右下斜腿"><div class="context"><div class="lockup"><img src="concepts/08-organic-r.png" alt="">RadWorld</div><p>一个连续体积，自然形成 R。<br>保留内部空腔与折转曲面的三维感。</p><div class="strip"><div class="size"><img src="concepts/08-organic-r.png" width="64" height="64" alt="64像素">64 px</div><div class="size"><img src="concepts/08-organic-r.png" width="32" height="32" alt="32像素">32 px</div><div class="size"><img src="concepts/08-organic-r.png" width="16" height="16" alt="16像素">16 px</div><div class="size"><img class="mono" src="concepts/08-organic-r.png" width="32" height="32" alt="单色轮廓">单色</div></div><div class="links"><a href="concepts/08-organic-r.png" download>下载 PNG ↗</a><a href="organic-r-brief.txt">设计简报 ↗</a></div></div></section><p class="note">第三轮 · Organic R<br><a href="organic-core.html" style="color:inherit">无字母版本</a> · <a href="round-2.html" style="color:inherit">第二轮</a> · <a href="round-1.html" style="color:inherit">第一轮</a></p></main><script>document.querySelector('.theme').addEventListener('click',function(){const light=document.body.classList.toggle('light');this.textContent=light?'深色预览':'浅色预览';this.setAttribute('aria-pressed',String(light))});</script></body></html>
